name: Update GitHub Tech Stack Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate global tech stack
        env:
          TECH_STACK_GITHUB_TOKEN: ${{ secrets.TECH_STACK_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate.py

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/tech-stack.svg data/tech-stack.json

          git diff --cached --quiet || git commit -m "chore: update GitHub tech stack stats"

          git push
